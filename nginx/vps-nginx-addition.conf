# ============================================================
# MyGravelGuy — Add these blocks to /opt/hosthampton/nginx/nginx.conf
# Insert inside the http { } block, after the Host Hampton server blocks
# ============================================================

  # ── MyGravelGuy upstream ─────────────────────────────────────
  upstream mygravelguy {
    server mygravelguy:80;
  }

  # ── MGG: Redirect HTTP → HTTPS ──────────────────────────────
  # (Add mygravelguy.com and www.mygravelguy.com to the existing HTTP→HTTPS redirect block)
  # Change this line:
  #   server_name api.hosthampton.com app.hosthampton.com staging.hosthampton.com www.hosthampton.com;
  # To:
  #   server_name api.hosthampton.com app.hosthampton.com staging.hosthampton.com www.hosthampton.com mygravelguy.com www.mygravelguy.com;

  # ── HTTPS — MyGravelGuy (mygravelguy.com) ──────────────────
  server {
    listen 443 ssl;
    server_name mygravelguy.com www.mygravelguy.com;

    ssl_certificate     /etc/ssl/mygravelguy/origin.pem;
    ssl_certificate_key /etc/ssl/mygravelguy/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Vite assets (hashed filenames, cache aggressively)
    location /assets/ {
      proxy_pass       http://mygravelguy/assets/;
      proxy_set_header Host $host;
      proxy_read_timeout 30s;
    }

    # SPA fallback — all routes serve through the container
    location / {
      proxy_pass       http://mygravelguy/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 30s;
    }
  }
