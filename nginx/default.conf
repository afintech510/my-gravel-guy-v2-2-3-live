server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # Cache static assets aggressively (Vite hashes filenames)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Cache other static files
    location ~* \.(ico|png|jpg|jpeg|gif|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # Never cache index.html (SPA entry point) — ensures fresh JS bundles after deploys
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # 301 redirect map (dead routes, /products->/shop, duplicate blog posts,
    # confirmed /locations/:slug -> metro redirects). Built by the AEO-
    # FOUNDATIONS agent; its own header comment originally proposed wiring it
    # into the shared VPS-level nginx.conf (nginx/vps-nginx-addition.conf)
    # instead, but that file lives outside this repo (manually applied on the
    # Hetzner host, shared with Host Hampton) and is easy to forget to update.
    # Including it here in the container-level config this repo actually
    # builds/deploys is more reliable — `location =` exact matches still win
    # over the generic `location /` below regardless of include order.
    # `location =` blocks are exact-match only, so this can't shadow any
    # prefix/regex route. See docs/metro/research/aeo-foundations-changes.md
    # §4 for what's in the file.
    include /etc/nginx/redirects.conf;

    # Prerendered routes first, then SPA fallback.
    # Build-time Playwright prerender (scripts/prerender/prerender.mjs) writes
    # dist/<route>/index.html for every route in prebuild/routes.json, so
    # `$uri/index.html` resolves a real, fully-rendered static file for those
    # paths before ever reaching the generic index.html shell. Anything not
    # prerendered (or a genuinely unknown path) still falls through to
    # /index.html, same as before — see docs/metro/research/prerender-implementation.md
    # "Risks" section for the soft-404 tradeoff this creates (an unknown path
    # now renders the homepage's baked content instead of an empty shell,
    # which is a wash-to-improvement, not a regression, but is still not a
    # real HTTP 404). A follow-up `error_page 404` pointing at a prerendered,
    # noindex-tagged 404 page is proposed there and not implemented in this pass.
    location / {
        try_files $uri $uri/index.html /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
