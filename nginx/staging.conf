# nginx/staging.conf — PREPARED BUT INACTIVE snippet for staging.mygravelguy.com.
#
# This is NOT picked up automatically by anything. The shared reverse proxy for this VPS
# (container `hampton_nginx`, image `nginx:alpine`) is configured by a file that lives OUTSIDE
# this repo, in the Host-Hampton project's own directory on the VPS
# (/opt/hosthampton/nginx/nginx.conf — confirmed by SSH read-only recon; see
# docs/metro/STAGING.md "VPS architecture"). That file already has one `server { listen 443 ssl;
# server_name mygravelguy.com www.mygravelguy.com; ... }` block for production (proxying to the
# `mygravelguy` container) — this file is written to match that exact same style/pattern, so an
# owner can paste it in as a new, separate `server` block for `staging.mygravelguy.com` without
# touching the existing production block at all.
#
# Owner action to activate (see docs/metro/STAGING.md "Runbook" for the full sequence):
#   1. Generate a basic-auth password file on the VPS (NOT in this repo/git):
#        sudo htpasswd -c /etc/nginx/staging.htpasswd <username>
#      (omit -c on a second user to add rather than overwrite).
#   2. Append the `server` blocks below into /opt/hosthampton/nginx/nginx.conf (e.g. just before
#      the production mygravelguy `server` block, or anywhere else at the `http {}` level).
#   3. `docker compose -f /opt/hosthampton/docker-compose.yml exec nginx nginx -t` to validate,
#      then `docker compose -f /opt/hosthampton/docker-compose.yml restart nginx` to apply — this
#      restarts the SHARED proxy, which briefly interrupts every site it fronts (production
#      mygravelguy.com included), so do this during a low-traffic window. `nginx -s reload` (a
#      signal, not a restart) is gentler if available for this container.
#   4. No new TLS certificate is needed — `/etc/ssl/mygravelguy/origin.pem` is already a Cloudflare
#      Origin CA cert covering `*.mygravelguy.com` + `mygravelguy.com` (confirmed via `openssl x509
#      -noout -text`), so it covers `staging.mygravelguy.com` too.
#
# Uses the SAME "Cloudflare Full (strict)" pattern as every other vhost in that file: Cloudflare
# terminates the edge TLS and proxies to this origin over HTTPS using this origin cert — nginx here
# never talks to Let's Encrypt/certbot for this domain.

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────
# (Add this server_name to the existing catch-all HTTP→HTTPS redirect server block in
# nginx.conf instead, if you'd rather not add a second `listen 80` block — either works.)
server {
  listen 80;
  server_name staging.mygravelguy.com;
  return 301 https://$host$request_uri;
}

# ── HTTPS — MyGravelGuy STAGING ───────────────────────────────────────────
server {
  listen 443 ssl;
  server_name staging.mygravelguy.com;

  ssl_certificate     /etc/ssl/mygravelguy/origin.pem;
  ssl_certificate_key /etc/ssl/mygravelguy/origin.key;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         HIGH:!aNULL:!MD5;

  # Basic-auth gate — the ONLY thing standing between this and the public internet (Cloudflare
  # still proxies/terminates TLS for the hostname, same as production, so the origin is not
  # directly exposed either way, but this stops a casual visitor/crawler that resolves the
  # hostname from seeing anything). File is created on the VPS directly (step 1 above), never
  # committed to this repo.
  auth_basic           "MyGravelGuy staging";
  auth_basic_user_file /etc/nginx/staging.htpasswd;

  # Defense-in-depth against indexing even if the basic-auth prompt is ever bypassed/misconfigured
  # — belt-and-suspenders alongside the disallow-all robots.txt override below and the client-side
  # <meta name="robots"> a prerendered/SPA page might otherwise carry from the production build.
  # `always` ensures this is sent on error responses (401 from auth_basic included) too.
  add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;

  # Overrides the app's own committed (permissive, production-oriented) public/robots.txt —
  # see docs/metro/STAGING.md "robots.txt override" — a real crawler that somehow gets past
  # basic-auth (e.g. Cloudflare-cached response, misconfigured auth) still sees a hard disallow.
  location = /robots.txt {
    add_header Content-Type text/plain;
    return 200 "User-agent: *\nDisallow: /\n";
  }

  location /assets/ {
    set $mgg_staging http://mygravelguy_staging:80;
    proxy_pass       $mgg_staging$request_uri;
    proxy_set_header Host $host;
    proxy_read_timeout 30s;
  }
  location / {
    set $mgg_staging http://mygravelguy_staging:80;
    proxy_pass       $mgg_staging;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }
}
