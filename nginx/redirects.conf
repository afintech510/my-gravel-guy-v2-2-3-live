# ============================================================
# MyGravelGuy — redirect map (AEO-FOUNDATIONS, docs/metro/research/
# seo-technical-audit.md §4 + docs/metro/research/aeo-plan.md).
#
# This file is a *snippet only* — it is not included in any server{}
# block by itself. The prerender agent owns the main nginx config
# (nginx/default.conf, nginx/vps-nginx-addition.conf); this file exists
# so redirect rules can be reviewed/changed independently of that work.
#
# HOW TO INCLUDE THIS FILE (for whoever wires up the real nginx config):
#   1. Copy/mount this file alongside the other nginx config on the VPS
#      (e.g. /opt/hosthampton/nginx/mygravelguy-redirects.conf).
#   2. Inside the `server { server_name mygravelguy.com www.mygravelguy.com; }`
#      block in nginx/vps-nginx-addition.conf, add one line BEFORE the
#      generic `location /` proxy_pass block:
#
#        include /opt/hosthampton/nginx/mygravelguy-redirects.conf;
#
#      (`location =` / `location ~` blocks can be included from a
#      separate file and still take precedence over `location /` as long
#      as the `include` line itself appears before `location /` in the
#      same server{} block — nginx picks the most specific match
#      regardless of source-file order, but keeping this convention
#      makes the precedence obvious to a human reader.)
#   3. `nginx -t` to validate, then reload.
#
# Every redirect below is a 301 (permanent) — these are confirmed,
# durable URL changes (dead routes, consolidations), not temporary
# maintenance redirects.
# ============================================================

# --- llms.txt referenced this path, but it was never a real route
#     (src/App.tsx has no /delivery-info route; it fell through to the
#     SPA shell and rendered NotFound with an HTTP 200).
#     Fixed at the source in the public/llms.txt rewrite (this agent);
#     this redirect covers anyone/anything that already has the old
#     URL cached (search engines, backlinks, bookmarks, other AI
#     crawlers' llms.txt caches). ---
location = /delivery-info {
  return 301 https://mygravelguy.com/delivery;
}

# --- /products vs /shop: /shop wins (richer JSON-LD — CollectionPage
#     schema — and it's what the primary nav "Order Now" CTA already
#     uses). Exact match only: /products/:slug (product detail pages,
#     e.g. /products/pea-gravel) is untouched and keeps working. ---
location = /products {
  return 301 https://mygravelguy.com/shop;
}

# --- Calculator consolidation: three routes exist for one job
#     (Calculator.tsx, CalculatorShop.tsx, ProductCalculator.tsx).
#     /calculator is canonical: shortest URL, already in the sitemap
#     at priority 0.8. Confirm with product before this ships to
#     production if traffic patterns differ from this assumption. ---
location = /product-calculator {
  return 301 https://mygravelguy.com/calculator;
}
location = /calculator-shop {
  return 301 https://mygravelguy.com/calculator;
}

# --- Duplicate blog posts (seo-technical-audit.md §2.9) — both halves
#     of each pair are live and sitemapped today. Direction below
#     matches scripts/generate-sitemap.mjs's DUPLICATE_BLOG_SLUGS_TO_DROP
#     (the loser is excluded from the sitemap; this redirect handles
#     live traffic/backlinks to the loser URL). Placeholder direction
#     per the audit — confirm which post in each pair has more existing
#     traffic/backlinks before treating this as final, then unpublish
#     the loser row in the Supabase `blog_posts` table. ---
location = /blog/gravel-vs-crushed-stone-differences {
  return 301 https://mygravelguy.com/blog/gravel-vs-crushed-stone;
}
location = /blog/10-gravel-driveway-ideas {
  return 301 https://mygravelguy.com/blog/10-driveway-ideas-using-gravel;
}
location = /blog/5-gravel-types-guide {
  return 301 https://mygravelguy.com/blog/5-gravel-types-and-when-to-use-them;
}

# --- Old /locations/:slug → new metro pages.
#     Confirmed DFW-metro-area slugs today (src/data/locations/texas.ts,
#     Dallas/Tarrant/Collin/Denton/Rockwall/Kaufman/Ellis/Johnson county
#     footprint per METRO-STRATEGY.md §2A) redirect into the new DFW
#     metro home page. Other Texas slugs (Austin, Houston, San Antonio,
#     El Paso) are NOT part of the DFW metro and are intentionally left
#     alone here — they're a separate future-metro decision, not part
#     of this pivot.
#
#     No existing /locations/:slug matches a Long Island / Suffolk
#     County town name (the only NY entry in src/data/locations is a
#     generic "new-york-ny" slug for New York City, not a Long Island
#     town) — so there is no Long Island /locations redirect to add
#     yet. Add one here if a matching slug is ever created before
#     /locations is retired. ---
location = /locations/dallas-tx {
  return 301 https://mygravelguy.com/dallas-fort-worth;
}
location = /locations/fort-worth-tx {
  return 301 https://mygravelguy.com/dallas-fort-worth;
}
location = /locations/arlington-tx {
  return 301 https://mygravelguy.com/dallas-fort-worth;
}

# --- Everything else under /locations/*: scripts/generate-sitemap.mjs
#     has dropped /locations from the sitemap entirely (see that file's
#     DROP_LOCATIONS comment and docs/metro/research/
#     aeo-foundations-changes.md) because the sitemap's old source
#     (Supabase `delivery_locations`) and the page's actual render data
#     (28 hardcoded slugs + an unauditable Google Sheet + a 10-entry
#     fallback object) are three disconnected lists — most of the ~196
#     URLs soft-404 today (HTTP 200, client-side redirect after 2s).
#     This block is deliberately NOT a blanket redirect/410 for all of
#     /locations/* — the routes above are the only ones confirmed to
#     both (a) resolve to real content today AND (b) be superseded by a
#     live metro page. Do not add a catch-all `location ~ ^/locations/`
#     rule without cross-checking it against the full list in
#     src/data/locations/*.ts + LocationPage.tsx's fallbackLocationData
#     first — some of those 38 slugs (e.g. seattle-wa) render real
#     content today and would wrongly 410/redirect if caught by a
#     blanket rule. ---
