name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-mygravelguy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 20m
          script: |
            set -e
            cd /opt/mygravelguy
            git fetch --all --prune
            git reset --hard origin/main
            docker compose up -d --build
            docker image prune -f
            docker compose ps
            curl -fsS --max-time 10 --retry 4 --retry-delay 3 --retry-connrefused --resolve mygravelguy.com:443:127.0.0.1 https://mygravelguy.com/ >/dev/null \
              && echo "health OK (mygravelguy.com)" \
              || echo "WARN: health check did not pass (deploy applied)"
