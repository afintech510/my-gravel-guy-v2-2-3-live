
# ========================================
# MATERIAL CATEGORY SELECTOR TEMPLATE
# ========================================
# This template defines the structure and content for the Material Category Selector
# Edit this file to customize categories, keywords, and product mappings

material_category_selector:
  # Global settings
  settings:
    free_shipping_text: "FREE SHIPPING NATIONWIDE"
    mobile_columns: 2  # Number of columns on mobile
    desktop_columns: 3  # Number of columns on desktop
    default_category: "popular"

  # Material Categories
  categories:
    - id: "popular"
      name: "Popular"
      icon: "⭐"
      description: "Most ordered materials"
      keywords:
        - "river"
        - "decomposed granite" 
        - "pea gravel"
        - "57 stone"
        - "fill dirt"
      # Products that should appear in this category
      featured_products:
        - "river-rock-1-2-inch"
        - "decomposed-granite"
        - "pea-gravel-3-8-inch"
        - "57-crushed-stone"
        - "fill-dirt-screened"

    - id: "gravel"
      name: "Gravel"
      icon: "🪨"
      description: "Decorative and functional gravel"
      keywords:
        - "pea gravel"
        - "river rock"
        - "crushed gravel"
        - "decorative rock"
      subcategories:
        - id: "decorative"
          name: "Decorative Gravel"
          products: ["river-rock", "pea-gravel", "mexican-beach-pebbles"]
        - id: "drainage"
          name: "Drainage Gravel"
          products: ["drainage-rock", "french-drain-gravel"]
        - id: "driveway"
          name: "Driveway Gravel"
          products: ["crusher-run", "411-gravel"]

    - id: "crushed-stone"
      name: "Crushed Stone"
      icon: "⚒️"
      description: "Crushed limestone, granite & stone"
      keywords:
        - "57"
      subcategories:
        - id: "limestone"
          name: "Limestone"
          products: ["57-limestone", "411-limestone"]
        - id: "granite"
          name: "Granite"
          products: ["57-granite", "crusher-run-granite"]

    - id: "sand"
      name: "Sand"
      icon: "🏖️"
      description: "Construction & decorative sand"
      keywords:
        - "mason sand"
        - "concrete sand"
        - "play sand"
        - "beach sand"
        - "washed sand"
        - "sand"
      subcategories:
        - id: "construction"
          name: "Construction Sand"
          products: ["mason-sand", "concrete-sand", "mortar-sand"]
        - id: "specialty"
          name: "Specialty Sand"
          products: ["play-sand", "beach-sand", "pool-sand"]

    - id: "soil-dirt"
      name: "Soil & Dirt"
      icon: "🌱"
      description: "Topsoil, fill dirt & compost"
      keywords:
        - "topsoil"
        - "fill dirt"
        - "compost"
        - "loam"
      subcategories:
        - id: "topsoil"
          name: "Topsoil"
          products: ["premium-topsoil", "screened-topsoil"]
        - id: "fill"
          name: "Fill Dirt"
          products: ["clean-fill-dirt", "screened-fill-dirt"]
        - id: "amendments"
          name: "Soil Amendments"
          products: ["compost", "loam", "potting-soil"]

    - id: "mulch"
      name: "Mulch"
      icon: "🌿"
      description: "Organic mulch & wood chips"
      keywords:
        - "mulch"
        - "wood chips"
        - "bark"
        - "hardwood mulch"
      subcategories:
        - id: "hardwood"
          name: "Hardwood Mulch"
          products: ["natural-hardwood-mulch", "chocolate-brown-mulch"]
        - id: "specialty"
          name: "Specialty Mulch"
          products: ["red-mulch", "black-mulch", "playground-chips"]

    - id: "concrete"
      name: "Concrete & RCA"
      icon: "🏗️"
      description: "Recycled concrete aggregate"
      keywords:
        - "recycled"
        - "rca"
        - "concrete"
      subcategories:
        - id: "rca"
          name: "Recycled Concrete"
          products: ["rca-base", "crushed-concrete"]
        - id: "aggregate"
          name: "Concrete Aggregate"
          products: ["concrete-aggregate", "road-base-concrete"]

    - id: "driveway"
      name: "Driveway"
      icon: "🚗"
      description: "Materials for driveways"
      keywords:
        - "driveway"
      recommended_products:
        - "crusher-run"
        - "411-gravel"
        - "rca-base"
        - "limestone-screenings"
      application_notes:
        - "Crusher run provides excellent compaction"
        - "RCA is cost-effective for large driveways"
        - "411 gravel works well for most residential driveways"

    - id: "walkway"
      name: "Walkway"
      icon: "🚶"
      description: "Materials for walkways"
      keywords:
        - "walkway"
      recommended_products:
        - "decomposed-granite"
        - "pea-gravel"
        - "limestone-screenings"
        - "crushed-shell"
      application_notes:
        - "Decomposed granite compacts well for walking surfaces"
        - "Pea gravel provides good drainage"

    - id: "patio"
      name: "Patio"
      icon: "🏡"
      description: "Materials for patios"
      keywords:
        - "rca"
        - "pea gravel"
        - "mason"
        - "3/8"
      recommended_products:
        - "rca-base"
        - "pea-gravel-3-8"
        - "mason-sand"
        - "limestone-screenings"
      application_notes:
        - "RCA provides stable base for pavers"
        - "Mason sand for leveling and joint filling"
        - "Pea gravel for drainage layer"

    - id: "landscape"
      name: "Landscape"
      icon: "🌳"
      description: "Decorative landscape materials"
      keywords:
        - "decorative rock"
        - "river rock"
        - "pea gravel"
        - "decomposed granite"
        - "mulch"
      recommended_products:
        - "river-rock-assorted"
        - "pea-gravel-decorative"
        - "decomposed-granite"
        - "lava-rock"
        - "premium-mulch"
      design_tips:
        - "River rock creates natural water feature look"
        - "Decomposed granite for modern, clean lines"
        - "Mulch for plant bed coverage and moisture retention"

  # Product definitions (referenced by categories above)
  products:
    river-rock-1-2-inch:
      name: "River Rock 1-2 Inch"
      size: "1-2\""
      category: "gravel"
      price_range: "$45-65"
      applications: ["landscaping", "drainage", "water features"]
      
    decomposed-granite:
      name: "Decomposed Granite"
      size: "Fine"
      category: "landscape"
      price_range: "$35-50"
      applications: ["walkways", "patios", "landscaping"]
      
    pea-gravel-3-8-inch:
      name: "Pea Gravel 3/8 Inch"
      size: "3/8\""
      category: "gravel"
      price_range: "$40-60"
      applications: ["drainage", "decorative", "concrete aggregate"]

    57-crushed-stone:
      name: "#57 Crushed Stone"
      size: "3/4\""
      category: "crushed-stone"
      price_range: "$30-45"
      applications: ["concrete", "drainage", "road base"]

    fill-dirt-screened:
      name: "Screened Fill Dirt"
      size: "Screened"
      category: "soil-dirt"
      price_range: "$25-40"
      applications: ["grading", "backfill", "foundation"]

  # Display settings
  display:
    show_product_count: true
    show_price_ranges: true
    enable_subcategory_expansion: true
    default_sort: "popularity"
    
  # Filtering options
  filters:
    enable_size_filter: true
    enable_price_filter: true
    enable_application_filter: true
    
  # Mobile specific settings
  mobile:
    enable_category_carousel: false
    show_descriptions: false
    compact_mode: true

# ========================================
# CUSTOMIZATION NOTES
# ========================================
# 
# To customize this template:
# 
# 1. ADD NEW CATEGORY:
#    - Add a new category object to the categories array
#    - Include unique id, name, icon, description, and keywords
#    - Reference products by their IDs in recommended_products
#
# 2. MODIFY EXISTING CATEGORY:
#    - Update keywords to change which products appear
#    - Modify description for different messaging
#    - Change icon (use emoji or icon name)
#
# 3. ADD NEW PRODUCTS:
#    - Add product definition to products section
#    - Reference the product ID in relevant categories
#
# 4. CUSTOMIZE DISPLAY:
#    - Modify display settings for different layouts
#    - Adjust mobile settings for responsive behavior
#
# 5. UPDATE KEYWORDS:
#    - Keywords determine which products appear in each category
#    - Products are matched by name and description against keywords
#
# ========================================
